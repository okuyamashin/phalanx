<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phalanx 3D</title>
<style>
  :root { --fg:#f2e8d2; --gold:#e0b25a; --red:#e46a5a; }
  html,body { margin:0; height:100%; overflow:hidden; background:#cbb894;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color:var(--fg); }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; left:0; right:0; top:0; display:flex; align-items:center; gap:16px;
    padding:10px 16px; background:linear-gradient(#000000aa,#00000000); pointer-events:none; font-size:15px; }
  #gauge { flex:1; max-width:420px; margin:0 auto; height:10px; background:#ffffff30; border-radius:5px; overflow:hidden; }
  #gaugeFill { height:100%; width:50%; background:var(--gold); transition:background .3s; }
  #mode { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); font-size:14px; letter-spacing:.2em;
    text-shadow:0 1px 3px #000; pointer-events:none; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#000000b0; text-align:center; padding:16px; }
  #overlay h1 { font-family: Georgia, serif; color:var(--gold); font-size:56px; margin:0 0 18px; letter-spacing:.08em; }
  #overlay p { margin:6px 0; font-size:17px; line-height:1.5; }
  #overlay .dim { color:#c8bba0; font-size:15px; }
  .hidden { display:none !important; }
  .float { position:fixed; transform:translate(-50%,-50%); font-weight:bold; pointer-events:none;
    text-shadow:0 1px 3px #000; white-space:nowrap; transition: opacity .9s, margin-top .9s; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <span id="ally">味方</span>
  <div id="gauge"><div id="gaugeFill"></div></div>
  <span id="foe">敵</span>
</div>
<div id="mode">盾</div>
<div id="overlay"></div>

<script type="module">
import * as THREE from 'three';
import { CFG, createGame } from './src/game.js';

// ===== 定数（ワールド座標） =====
const COL_GAP = 0.82;        // 列の間隔（盾の直径0.9より狭く＝盾が重なる）
const RANK_GAP = 0.8;        // 前後の間隔
const PX2M = 0.03;           // ゲームの「押し位置」→ メートル
const OUR_RANKS = 4;         // 後ろに見せる予備の列数
const colX = i => (i - (CFG.cols - 1) / 2) * COL_GAP;
const lineZ = line => (line - CFG.lineStart) * PX2M; // 接触線のz（+z が自軍の後方）

// ===== レンダラー・シーン =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8c9a8, 30, 140);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

// 空（上は青、地平線は砂ぼこり色）
{
  const g = new THREE.SphereGeometry(300, 32, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x6f95c2) }, mid: { value: new THREE.Color(0xc9d3d8) }, bot: { value: new THREE.Color(0xd8c9a8) } },
    vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top,mid,bot; varying vec3 p; void main(){ float h=p.y; vec3 c = h>0.08 ? mix(mid,top,smoothstep(0.08,0.6,h)) : mix(bot,mid,smoothstep(-0.05,0.08,h)); gl_FragColor=vec4(c,1.); }',
  });
  scene.add(new THREE.Mesh(g, m));
}

// 光：夕方の低い太陽
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x8a6a40, 0.9));
const sun = new THREE.DirectionalLight(0xffd8a0, 2.6);
sun.position.set(-14, 11, -10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// 地面（ざらついた土）
function noiseTexture(size, base, vary, dots) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, size, size);
  for (let k = 0; k < dots; k++) {
    const v = Math.random();
    x.fillStyle = `rgba(${v > .5 ? '255,240,210' : '60,40,20'},${Math.random() * vary})`;
    const r = Math.random() * 3 + 0.5;
    x.fillRect(Math.random() * size, Math.random() * size, r, r);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
{
  const tex = noiseTexture(256, '#a88a5e', 0.25, 9000); tex.repeat.set(60, 60);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);
}
// 勝ち・負けの目印の線
function stripe(z, color) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(CFG.cols * COL_GAP + 6, 0.35), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55 }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, 0.01, z); scene.add(m);
}
stripe(lineZ(CFG.lineWin) - 0.6, 0x8b2a22);
stripe(lineZ(CFG.lineLose) + 0.6, 0x2a4a7a);

// 背景：丘とオリーブの木
{
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x8c8a62, roughness: 1, flatShading: true });
  for (let k = 0; k < 14; k++) {
    const h = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), hillMat);
    const a = rand(-1.3, 1.3);
    h.position.set(Math.sin(a) * rand(70, 120), -2, -Math.cos(a) * rand(70, 120));
    h.scale.set(rand(15, 35), rand(6, 16), rand(12, 25));
    scene.add(h);
  }
  const trunk = new THREE.CylinderGeometry(0.15, 0.25, 2, 6);
  const crown = new THREE.IcosahedronGeometry(1.4, 0);
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 1 });
  const crownM = new THREE.MeshStandardMaterial({ color: 0x59683c, roughness: 1, flatShading: true });
  for (let k = 0; k < 45; k++) {
    const t = new THREE.Group();
    const a = new THREE.Mesh(trunk, trunkM); a.position.y = 1;
    const b = new THREE.Mesh(crown, crownM); b.position.y = 2.6; b.scale.set(1.3, 0.9, 1.2);
    a.castShadow = b.castShadow = true;
    t.add(a, b);
    let x, z;
    do { x = rand(-60, 60); z = rand(-70, 30); } while (Math.abs(x) < 16 + Math.max(0, -z) * 0.25 || (x > 0 && z > -25));
    t.position.set(x, 0, z); t.scale.setScalar(rand(0.8, 1.5)); t.rotation.y = rand(0, 6);
    scene.add(t);
  }
}
function rand(a, b) { return a + Math.random() * (b - a); }

// ===== 兵士モデル（仮：基本図形の組み合わせ） =====
const M = {
  bronze: new THREE.MeshStandardMaterial({ color: 0xb48a4a, metalness: 0.75, roughness: 0.38 }),
  linen: new THREE.MeshStandardMaterial({ color: 0xd9ceb2, roughness: 0.9 }),
  red: new THREE.MeshStandardMaterial({ color: 0x7c2a22, roughness: 0.9 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xa8714c, roughness: 0.8 }),
  crest: new THREE.MeshStandardMaterial({ color: 0x1b1612, roughness: 1 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x6b4a2c, roughness: 0.8 }),
  iron: new THREE.MeshStandardMaterial({ color: 0xc8c8c8, metalness: 0.9, roughness: 0.3 }),
  eTunic: new THREE.MeshStandardMaterial({ color: 0x3b3552, roughness: 0.9 }),
  eShield: new THREE.MeshStandardMaterial({ color: 0x9a7d50, roughness: 1 }),
  eCap: new THREE.MeshStandardMaterial({ color: 0x2c2a2a, roughness: 0.9 }),
  ringRed: new THREE.MeshBasicMaterial({ color: 0xff3030, transparent: true, opacity: 0.75, depthWrite: false }),
  ringGold: new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.6, depthWrite: false }),
};
const G = {
  leg: new THREE.CylinderGeometry(0.07, 0.065, 0.85, 8),
  greave: new THREE.CylinderGeometry(0.085, 0.075, 0.42, 8),
  skirt: new THREE.CylinderGeometry(0.21, 0.29, 0.32, 10),
  torso: new THREE.CylinderGeometry(0.24, 0.2, 0.55, 10),
  arm: new THREE.CylinderGeometry(0.05, 0.045, 0.5, 6),
  head: new THREE.SphereGeometry(0.12, 10, 8),
  helmet: new THREE.SphereGeometry(0.145, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.62),
  cheek: new THREE.BoxGeometry(0.26, 0.14, 0.2),
  crest: new THREE.CylinderGeometry(0.2, 0.2, 0.05, 16, 1, false, 0, Math.PI),
  shield: new THREE.CylinderGeometry(0.46, 0.46, 0.06, 28),
  boss: new THREE.TorusGeometry(0.44, 0.025, 6, 28),
  spear: new THREE.CylinderGeometry(0.018, 0.018, 2.7, 6),
  tip: new THREE.ConeGeometry(0.035, 0.22, 6),
  eShield: new THREE.BoxGeometry(0.62, 0.95, 0.05),
  eCap: new THREE.ConeGeometry(0.15, 0.3, 10),
  ring: new THREE.RingGeometry(0.32, 0.42, 24),
};

function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; return m;
}

// enemy=false なら自軍。どちらも -z 方向を向いて作り、敵は後で180度回す
function makeSoldier(enemy) {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const tunic = enemy ? M.eTunic : M.red;
  body.add(mesh(G.leg, M.skin, -0.1, 0.425), mesh(G.leg, M.skin, 0.1, 0.425));
  if (!enemy) body.add(mesh(G.greave, M.bronze, -0.1, 0.27), mesh(G.greave, M.bronze, 0.1, 0.27));
  body.add(mesh(G.skirt, tunic, 0, 0.95));
  body.add(mesh(G.torso, enemy ? M.eTunic : M.linen, 0, 1.36));
  body.add(mesh(G.head, M.skin, 0, 1.73));
  if (enemy) {
    body.add(mesh(G.eCap, M.eCap, 0, 1.88));
  } else {
    body.add(mesh(G.helmet, M.bronze, 0, 1.72));
    const ch = mesh(G.cheek, M.bronze, 0, 1.68, -0.02); body.add(ch);
    const cr = mesh(G.crest, M.crest, 0, 1.86, 0); cr.rotation.set(0, Math.PI / 2, Math.PI / 2); body.add(cr);
  }

  // 盾（左腕）。自軍は丸いブロンズの盾、敵は編み細工の四角い盾
  const shieldPivot = new THREE.Group(); shieldPivot.position.set(-0.2, 1.15, -0.28); body.add(shieldPivot);
  if (enemy) {
    shieldPivot.add(mesh(G.eShield, M.eShield));
  } else {
    const s = mesh(G.shield, M.bronze); s.rotation.x = Math.PI / 2; shieldPivot.add(s);
    const rim = mesh(G.boss, M.bronze, 0, 0, -0.035); shieldPivot.add(rim);
  }

  // 槍（右肩）。spearPivot を回して構える
  const spearPivot = new THREE.Group(); spearPivot.position.set(0.24, 1.5, 0); body.add(spearPivot);
  const shaft = mesh(G.spear, M.wood, 0, 0, -0.75); shaft.rotation.x = Math.PI / 2; spearPivot.add(shaft);
  const tip = mesh(G.tip, M.iron, 0, 0, -0.75 - 1.35 - 0.1); tip.rotation.x = -Math.PI / 2; spearPivot.add(tip);
  const arm = mesh(G.arm, M.skin, 0.24, 1.32, -0.05); arm.rotation.x = 0.4; body.add(arm);

  // 足元の合図リング（敵のみ）：赤＝攻撃の構え、金＝戻り中（狙いどき）
  let ring = null;
  if (enemy) {
    ring = new THREE.Mesh(G.ring, M.ringRed); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; ring.visible = false;
    root.add(ring);
    root.rotation.y = Math.PI;
  }
  scene.add(root);
  return { root, body, shieldPivot, spearPivot, ring, enemy, pose: { spearUp: 0.7, spearZ: 0, shieldOpen: 0 } };
}

// 槍・盾の姿勢を目標値へなめらかに寄せる
function pose(s, target, dt, speed = 14) {
  const p = s.pose, k = Math.min(1, dt * speed);
  for (const key in target) p[key] += (target[key] - p[key]) * k;
  s.spearPivot.rotation.x = p.spearUp;
  s.spearPivot.position.z = p.spearZ;
  s.shieldPivot.rotation.y = p.shieldOpen * 0.9;
  s.shieldPivot.position.x = -0.2 - p.shieldOpen * 0.18;
}

// ===== 兵の配置 =====
const ours = [], enemies = [], ourReserve = [], enemyRanks = [];
for (let i = 0; i < CFG.cols; i++) {
  ours.push({ ...makeSoldier(false), enter: 0 });
  enemies.push({ ...makeSoldier(true), enter: 0 });
}
for (let k = 0; k < OUR_RANKS; k++) for (let i = 0; i < CFG.cols; i++) ourReserve.push(makeSoldier(false));
for (let k = 0; k < CFG.enemyMaxDepth; k++) for (let i = 0; i < CFG.cols; i++) enemyRanks.push(makeSoldier(true));

const corpses = [];
function addCorpse(enemy, x, z) {
  const s = makeSoldier(enemy);
  s.root.position.set(x, 0, z);
  s.root.rotation.y = (enemy ? Math.PI : 0) + rand(-0.6, 0.6);
  corpses.push({ s, t: 0, dir: enemy ? -1 : 1 });
}

// ===== 演出：火花・砂ぼこり・浮かぶ文字 =====
function softDot() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, '#ffffffff'); g.addColorStop(1, '#ffffff00');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const dotTex = softDot();

class Particles {
  constructor(n, size, color, opacity, additive) {
    this.n = n; this.i = 0;
    this.pos = new Float32Array(n * 3); this.vel = new Float32Array(n * 3); this.life = new Float32Array(n);
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.mat = new THREE.PointsMaterial({ size, map: dotTex, color, transparent: true, opacity, depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
    this.pts = new THREE.Points(this.geo, this.mat); this.pts.frustumCulled = false;
    for (let k = 0; k < n; k++) this.pos[k * 3 + 1] = -99;
    scene.add(this.pts);
  }
  emit(x, y, z, vx, vy, vz, life) {
    const k = this.i++ % this.n;
    this.pos.set([x, y, z], k * 3); this.vel.set([vx, vy, vz], k * 3); this.life[k] = life;
  }
  update(dt, gravity, drag) {
    for (let k = 0; k < this.n; k++) {
      if (this.life[k] <= 0) continue;
      this.life[k] -= dt;
      const j = k * 3;
      this.vel[j + 1] -= gravity * dt;
      for (let a = 0; a < 3; a++) { this.vel[j + a] *= 1 - drag * dt; this.pos[j + a] += this.vel[j + a] * dt; }
      if (this.life[k] <= 0) this.pos[j + 1] = -99;
    }
    this.geo.attributes.position.needsUpdate = true;
  }
}
const sparks = new Particles(300, 0.09, 0xffe7a0, 1, true);
const blood = new Particles(300, 0.12, 0x7a1010, 0.9, false);
const puffs = new Particles(400, 1.6, 0xcdb48a, 0.28, false);
const haze = new Particles(500, 3.2, 0xd8c39a, 0.12, false); // 漂う砂ぼこり

function sparkAt(x, y, z, n = 10) { for (let k = 0; k < n; k++) sparks.emit(x, y, z, rand(-2.5, 2.5), rand(0.5, 3.5), rand(-2.5, 2.5), rand(0.2, 0.45)); }
function bloodAt(x, y, z) { for (let k = 0; k < 14; k++) blood.emit(x, y, z, rand(-1.5, 1.5), rand(0.5, 2.5), rand(-1.5, 1.5), rand(0.3, 0.6)); }
function puffAt(x, z, n = 3) { for (let k = 0; k < n; k++) puffs.emit(x + rand(-0.4, 0.4), 0.3, z + rand(-0.4, 0.4), rand(-0.6, 0.6), rand(0.2, 0.7), rand(-0.6, 0.6), rand(1.2, 2.2)); }

function floatText(worldPos, text, color, size = 16) {
  const v = worldPos.clone().project(camera);
  if (v.z > 1) return;
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = text; d.style.color = color; d.style.fontSize = size + 'px';
  d.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; d.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px';
  document.body.appendChild(d);
  requestAnimationFrame(() => { d.style.opacity = '0'; d.style.marginTop = '-40px'; });
  setTimeout(() => d.remove(), 950);
}

// ===== 音 =====
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.2, hp = 2000) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
  s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start();
}
let sfxBudget = 0;
const SFX = {
  drum() { tone(65, 0.45, 'sine', 0.7, 0.5); noise(0.12, 0.2, 300); },
  clang() { if (sfxBudget-- > 0) { noise(0.09, 0.12, 3000); tone(1400 + Math.random() * 600, 0.08, 'square', 0.03); } },
  kill() { if (sfxBudget-- > 0) tone(180, 0.15, 'sawtooth', 0.08, 0.4); },
  hurt() { if (sfxBudget-- > 0) tone(110, 0.25, 'triangle', 0.18, 0.5); },
};

// ===== ゲームとつなぐ =====
let contactZ = 0, shake = 0, thrustCam = 0;
const ourZ = () => contactZ + 0.55;
const enZ = () => contactZ - 0.55;

const game = createGame((type, i, why) => {
  if (type === 'thrust') {
    SFX.drum(); thrustCam = 1;
    for (let c = 0; c < CFG.cols; c++) puffAt(colX(c), ourZ(), 2);
    floatText(new THREE.Vector3(0, 2.6, ourZ()), '突け！', '#e0b25a', 28);
  } else if (type === 'blocked' || type === 'clash') {
    sparkAt(colX(i), 1.3, contactZ, type === 'clash' ? 6 : 10); SFX.clang();
  } else if (type === 'ourDeath') {
    addCorpse(false, colX(i), ourZ());
    bloodAt(colX(i), 1.2, ourZ()); puffAt(colX(i), ourZ(), 4);
    floatText(new THREE.Vector3(colX(i), 2.2, ourZ()), why, '#ff8a7a', 14);
    SFX.hurt(); shake = Math.max(shake, 0.12);
  } else if (type === 'enemyDeath') {
    addCorpse(true, colX(i), enZ());
    bloodAt(colX(i), 1.2, enZ()); puffAt(colX(i), enZ(), 3);
    SFX.kill();
  } else if (type === 'ourRefill') {
    ours[i].enter = 1;
  } else if (type === 'enemyRefill') {
    enemies[i].enter = 1;
  } else if (type === 'end' || type === 'start') {
    showOverlay();
  }
});

// 入力（あとでスマホのセンサーに差し替えられるよう、ここだけに集める）
function doThrust() { audio(); game.thrust(); }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) doThrust(); }
  if (e.code === 'KeyR') { game.reset(); clearCorpses(); showOverlay(); }
});
addEventListener('pointerdown', doThrust);

function clearCorpses() { for (const c of corpses) scene.remove(c.s.root); corpses.length = 0; }

// ===== HUD・オーバーレイ =====
const $ = id => document.getElementById(id);
function showOverlay() {
  const S = game.S, ov = $('overlay');
  if (S.phase === 'play') { ov.classList.add('hidden'); return; }
  ov.classList.remove('hidden');
  if (S.phase === 'title') {
    clearCorpses();
    ov.innerHTML = `<h1>PHALANX</h1>
      <p>盾を並べて守れ。号令で一斉に突け。</p>
      <p><b>スペースキー（またはクリック）</b>＝ 隊全体で突く　／　それ以外はずっと守り</p>
      <p class="dim">足元が<span style="color:#ff6a5a">赤く光る敵</span>＝攻撃の構え（スキあり、でも来る）<br>
      足元が<span style="color:#ffe08a">金色に光る敵</span>＝戻り中（狙いどき）<br>
      盾を構えた敵に突くと、弾かれて反撃されることがある<br>
      突いている間は無防備。守ってばかりだと敵が増えて押される。</p>
      <p style="margin-top:18px">スペースで開始</p>`;
  } else {
    const win = S.phase === 'win';
    ov.innerHTML = `<h1>${win ? '勝利' : '敗北'}</h1>
      <p>${win ? `敵陣まで押し切った（${S.endT.toFixed(1)}秒）` : S.why}</p>
      <p class="dim">倒した敵 ${S.kills}　失った味方 ${S.lost}　突撃 ${S.thrusts}回</p>
      <p style="margin-top:18px">スペースでもう一度</p>`;
  }
}
function updateHud() {
  const S = game.S;
  $('ally').textContent = `味方 前列${S.ours.filter(o => o.alive).length}  予備${S.reserves}`;
  $('foe').textContent = `敵 ${game.enemyTotal()}`;
  const p = (S.line - CFG.lineWin) / (CFG.lineLose - CFG.lineWin);
  $('gaugeFill').style.width = (100 * (1 - p)).toFixed(1) + '%';
  $('gaugeFill').style.background = p < 0.5 ? '#e0b25a' : p < 0.8 ? '#e07b39' : '#e04848';
  const m = $('mode');
  if (S.thrustT >= 0) { m.textContent = '― 突撃中（無防備）―'; m.style.color = '#ffb08a'; }
  else { m.textContent = '盾'; m.style.color = '#f2e8d2'; }
}

// ===== カメラ：ふだんは斜め後ろの高め、突く瞬間は肩越しに寄る =====
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const wideCam = () => ({ pos: new THREE.Vector3(10, 6.5, contactZ + 3.8), look: new THREE.Vector3(-1, 0.3, contactZ - 1.5) });
const closeCam = () => ({ pos: new THREE.Vector3(colX(6) + 0.41, 2.0, ourZ() + 0.75), look: new THREE.Vector3(-0.8, 1.15, contactZ - 5) });
function updateCamera(dt) {
  thrustCam = Math.max(0, thrustCam - dt / 1.1);
  // 寄るのは速く、戻るのはゆっくり
  const w = thrustCam > 0 ? Math.min(1, Math.sin(Math.min(1, (1 - thrustCam) * 4) * Math.PI / 2) * (thrustCam > 0.25 ? 1 : thrustCam / 0.25)) : 0;
  const a = wideCam(), b = closeCam();
  const tp = a.pos.lerp(b.pos, w), tl = a.look.lerp(b.look, w);
  const k = Math.min(1, dt * 8);
  camPos.lerp(tp, k); camLook.lerp(tl, k);
  camera.position.copy(camPos);
  if (shake > 0) { camera.position.x += rand(-shake, shake); camera.position.y += rand(-shake, shake); shake = Math.max(0, shake - dt * 0.8); }
  camera.lookAt(camLook);
}

// ===== 毎フレーム =====
function updateWorld(dt) {
  const S = game.S;
  contactZ += (lineZ(S.line) - contactZ) * Math.min(1, dt * 5);
  sun.position.set(-14, 11, contactZ - 10); sun.target.position.set(0, 0, contactZ);

  // 自軍の突きの伸び（0〜1）
  const tt = S.thrustT;
  const ext = tt < 0 ? 0 : tt < CFG.thrustHitAt ? tt / CFG.thrustHitAt : Math.max(0, 1 - (tt - CFG.thrustHitAt) / (CFG.thrustEnd - CFG.thrustHitAt));

  for (let i = 0; i < CFG.cols; i++) {
    const o = ours[i], alive = S.ours[i].alive;
    o.root.visible = alive;
    o.enter = Math.max(0, o.enter - dt * 3.5);
    o.root.position.set(colX(i), 0, ourZ() + o.enter * RANK_GAP);
    o.root.position.z += ext * -0.18; // 体ごと少し前へ
    pose(o, { spearUp: ext > 0.02 ? 0.02 : 0.12, spearZ: -ext * 0.85, shieldOpen: ext > 0.02 ? 0.55 : 0 }, dt, 22);

    const e = enemies[i], es = S.enemies[i];
    e.root.visible = es.alive;
    e.enter = Math.max(0, e.enter - dt * 3.5);
    e.root.position.set(colX(i), 0, enZ() - e.enter * RANK_GAP);
    let tgt = { spearUp: 0.15, spearZ: 0, shieldOpen: 0 };
    e.ring.visible = false;
    if (es.state === 'windup') { tgt = { spearUp: 0.25, spearZ: 0.45, shieldOpen: 0.4 }; e.ring.visible = true; e.ring.material = M.ringRed; }
    if (es.state === 'strike') { tgt = { spearUp: 0.0, spearZ: -0.85, shieldOpen: 0.6 }; e.ring.visible = true; e.ring.material = M.ringRed; }
    if (es.state === 'recover') { tgt = { spearUp: 0.35, spearZ: 0.1, shieldOpen: 1 }; e.ring.visible = true; e.ring.material = M.ringGold; }
    pose(e, tgt, dt, es.state === 'strike' ? 30 : 12);
  }

  // 後列（自軍の予備・敵の増援）
  for (let k = 0; k < OUR_RANKS; k++) for (let i = 0; i < CFG.cols; i++) {
    const s = ourReserve[k * CFG.cols + i];
    s.root.visible = k * CFG.cols + i < S.reserves;
    s.root.position.set(colX(i) + (k % 2 ? 0.05 : -0.05), 0, ourZ() + (k + 1) * RANK_GAP);
    // 後列は槍を立てる。2列目・3列目は号令で前列と一緒に槍を倒して突く
    pose(s, k < 2 ? { spearUp: 1.2 - Math.min(1, ext * 2) * (1.1 - k * 0.1), spearZ: -ext * 0.6, shieldOpen: 0 } : { spearUp: 1.2, spearZ: 0, shieldOpen: 0 }, dt, 18);
  }
  for (let k = 0; k < CFG.enemyMaxDepth; k++) for (let i = 0; i < CFG.cols; i++) {
    const s = enemyRanks[k * CFG.cols + i];
    s.root.visible = k < S.depth[i];
    s.root.position.set(colX(i) + Math.sin(i * 7 + k * 3) * 0.12, 0, enZ() - (k + 1) * RANK_GAP);
    pose(s, { spearUp: 1.0, spearZ: 0, shieldOpen: 0.1 }, dt);
  }

  // 倒れる兵
  for (let n = corpses.length - 1; n >= 0; n--) {
    const c = corpses[n]; c.t += dt;
    const f = Math.min(1, c.t / 0.45);
    c.s.body.rotation.x = c.dir * (Math.PI / 2) * (f * f) * 0.95;
    c.s.root.position.y = c.t > 5 ? -(c.t - 5) * 0.4 : 0;
    if (c.t > 7) { scene.remove(c.s.root); corpses.splice(n, 1); }
  }

  // 漂うほこり
  if (Math.random() < dt * 25) haze.emit(rand(-12, 12), rand(0.3, 2.5), contactZ + rand(-14, 10), rand(0.2, 0.8), rand(-0.05, 0.1), rand(-0.2, 0.2), rand(5, 9));
  if (S.phase === 'play' && Math.random() < dt * 12) puffAt(rand(-4.5, 4.5), contactZ + rand(-0.6, 0.6), 1);
  sparks.update(dt, 6, 2); blood.update(dt, 7, 1); puffs.update(dt, -0.05, 0.8); haze.update(dt, 0, 0.05);
}

let last = performance.now();
camPos.copy(wideCam().pos); camLook.copy(wideCam().look);
showOverlay();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  sfxBudget = 3;
  game.update(dt);
  updateWorld(dt);
  updateCamera(dt);
  updateHud();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
