<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phalanx</title>
<style>
  :root { --fg:#f2e8d2; --gold:#e0b25a; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1a140e; color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  canvas { display:block; touch-action:none; }
  /* 右奥の砂煙と周辺の暗さ。キャンバスに毎回描くと重いので、上に重ねた板で表す */
  #air { position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 55% at 50% 50%, transparent 55%, rgba(20,10,0,.55) 100%),
      radial-gradient(circle at 92% 50%, rgba(225,200,150,.35), rgba(225,200,150,0) 40%); }
  @media (max-width: 600px) { #overlay h1 { font-size:40px; } #overlay p { font-size:15px; } #overlay .dim { font-size:13px; } }
  #hud { position:fixed; left:0; right:0; top:0; display:flex; align-items:center; gap:16px;
    padding:10px 16px; background:linear-gradient(#000000aa,#00000000); pointer-events:none; font-size:15px; text-shadow:0 1px 2px #000; }
  #gauge { flex:1; max-width:420px; margin:0 auto; height:10px; background:#ffffff30; border-radius:5px; overflow:hidden; }
  #gaugeFill { height:100%; width:50%; background:var(--gold); }
  #hud .side { display:flex; align-items:center; gap:8px; min-width:90px; }
  #hud .side:last-child { justify-content:flex-end; }
  #hud b, .stats b { font-family: Georgia, "Times New Roman", serif; font-weight:normal; font-size:20px; letter-spacing:.06em; }
  .ico { display:inline-block; flex:none; box-shadow:0 1px 3px #000a; }
  .ico.aspis { width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #f0cf8a, #a8742c 60%, #6e4a1a); }
  .ico.spara { width:12px; height:18px; border-radius:3px; background:repeating-linear-gradient(#d2ae74 0 2px, #8a6a3a 2px 4px); }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#000000b0; text-align:center; padding:16px; }
  #overlay h1 { font-family: Georgia, serif; color:var(--gold); font-size:56px; margin:0 0 18px; letter-spacing:.08em; }
  #overlay p { margin:6px 0; font-size:17px; line-height:1.5; }
  #overlay .dim { color:#c8bba0; font-size:15px; }
  .hidden { display:none !important; }
  /* 勝敗の画面：崖から落とされる絵を背景に */
  #overlay.end { justify-content:flex-start; padding-top:7vh; background:#000; overflow:hidden; }
  #overlay.end .bg { position:absolute; inset:0; background-size:cover; background-position:center;
    animation: endZoom 6s ease-out both; z-index:-1; }
  #overlay.end::after { content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(#000000b0, #00000020 40%, #00000000 65%, #000000c0); }
  #overlay.end > * { position:relative; animation: endFade 1.2s ease-out both; }
  #overlay.end p { text-shadow:0 2px 6px #000; }
  #overlay.end h1 { font-size:72px; text-shadow:0 3px 12px #000; }
  #overlay.win .bg { background-image:url(assets/screens/victory.jpg); }
  #overlay.lose .bg { background-image:url(assets/screens/defeat.jpg); }
  #overlay.lose { align-items:flex-start; text-align:left; padding-left:6vw; }  /* 敗北の絵は右上に敵がいるので文字は左へ */
  #overlay.lose h1 { color:#e8d2b0; }
  #overlay { isolation:isolate; }
  /* タイトル：両軍の整列の絵を、横に流しながらフェードで切り替える */
  #overlay.title { background:#000; justify-content:flex-start; padding-top:7vh; overflow:hidden; }
  #overlay.title::after { content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(#000000c0, #00000030 35%, #00000000 55%, #000000d0); }
  #slides { position:absolute; inset:0; z-index:-2; overflow:hidden; }
  #slides div { position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:0; transition:opacity 1.8s ease; will-change:transform, opacity; }
  #slides div.show { opacity:1; }
  #slides div.pan-l { animation:panL 9.5s linear both; }
  #slides div.pan-r { animation:panR 9.5s linear both; }
  @keyframes panL { from { transform:scale(1.18) translateX(6%); } to { transform:scale(1.18) translateX(-6%); } }
  @keyframes panR { from { transform:scale(1.18) translateX(-6%); } to { transform:scale(1.18) translateX(6%); } }
  #overlay.title h1 { font-size:84px; margin-bottom:6px; text-shadow:0 4px 16px #000; animation:endFade 1.4s ease-out both; }
  #overlay.title .start { margin:auto 0 4px; font-family:Georgia, serif; font-size:30px; letter-spacing:.35em; color:#f2e8d2;
    text-shadow:0 2px 8px #000; animation:blink 1.6s ease-in-out infinite; }
  #overlay.title .key { margin:0 0 5vh; font-size:11px; letter-spacing:.3em; color:#f2e8d2aa; }
  #overlay.end .stats { display:flex; align-items:center; gap:10px; font-size:20px; animation-delay:.4s; }
  #overlay.end .again { font-size:28px; margin-top:10px; opacity:.8; }
  @keyframes blink { 50% { opacity:.35; } }
  @media (max-height: 500px) {
    #overlay.title { padding-top:3vh; }
    #overlay.title h1 { font-size:46px; }
    #overlay.title .start { font-size:22px; }
    #overlay.title .key { margin-bottom:3vh; }
  }
  @keyframes endZoom { from { transform:scale(1.12); filter:brightness(.6); } to { transform:scale(1); filter:brightness(1); } }
  @keyframes endFade { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @media (max-height: 500px) { #overlay.end h1 { font-size:44px; margin-bottom:8px; } #overlay.end p { font-size:14px; margin:3px 0; } }
  /* 奥の列の敵の様子（手前の兵に隠れて見えない分を補う） */
  #pips { position:fixed; top:34px; left:50%; transform:translateX(-50%); display:flex; gap:5px; align-items:center;
    padding:4px 8px; border-radius:10px; background:#00000055; pointer-events:none; }
  #pips i { width:12px; height:12px; border-radius:50%; background:#ffffff30; box-shadow:0 0 0 1px #0006 inset; }
  #pips i.red { background:#ff4a3a; box-shadow:0 0 8px #ff4a3a; }
  #pips i.gold { background:#ffd46e; box-shadow:0 0 8px #ffd46e; }
  #pips i.gap { background:transparent; box-shadow:0 0 0 1px #ffffff40 inset; }
  #pips i.us { width:4px; border-radius:2px; height:12px; }
  #pips span { font-size:11px; color:#f2e8d2aa; margin:0 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="air"></div>
<div id="hud">
  <span class="side"><i class="ico aspis"></i><b id="ally"></b></span>
  <div id="gauge"><div id="gaugeFill"></div></div>
  <span class="side"><b id="foe"></b><i class="ico spara"></i></span>
</div>
<div id="pips"></div>
<div id="overlay"></div>

<script type="module">
// スプライト（疑似3D）の見た目を、src/game.js のルールにつないだ本編。
import { CFG, createGame } from './src/game.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = t => t * t * (3 - 2 * t);

// ===== 素材 =====
const SPRITES = { hoplite: {}, persian: {} };
function loadSprite(name) {
  const s = SPRITES[name];
  return Promise.all([
    fetch(`assets/sprites/${name}.json`).then(r => r.json()).then(m => { s.meta = m; }),
    new Promise((ok, ng) => { s.img = new Image(); s.img.onload = ok; s.img.onerror = ng; s.img.src = `assets/sprites/${name}.png`; }),
  ]);
}
const BODY_PX = 330;   // 手前の兵の身長（unit=1のときの画面px）

// ===== 配置 =====
const FILES = CFG.cols;          // 奥に向かう人数（ルール上の「列」）
const SHOW_RANKS = 3;            // 見せる前後の列数（前列＋後ろ2列）
const GAP = 330;                 // 味方の前列と敵の前列の間
const RANK_GAP = 170;
const LINE_PX = 0.9;             // 押し合いの位置（ルール）→ 画面のずれ
let shift = 0;                   // 隊列全体の左右のずれ（押されると左へ）

// 横向きは迫力重視：手前の兵が画面の高さの86%になる大きさ。縦向きは全体が見える大きさ。
// URLに ?zoom=0.6 のように付けると、さらに倍率を掛けられる（試し用）
const ZOOM = +new URLSearchParams(location.search).get('zoom') || 1;
const landscape = () => W > H;
// カメラは隊列を半分ほど追いかける。押されると地面や倒れた兵が流れて見える
const CAM_FOLLOW = 0.6;
let camX = 0;
function view() {
  return {
    near: { x: W * 0.38, y: H * (landscape() ? 0.985 : 0.93) },
    vp: { x: W * 0.16, y: H * 0.42 },
    base: (landscape() ? H * 0.86 / BODY_PX : Math.min(W / 950, H / 850)) * ZOOM,
  };
}
function project(file, wx, rankY = 0) {
  const { near, vp, base } = view();
  const sc = 1 / (1 + file * 0.2);
  const unit = base * sc;
  return { x: vp.x + (near.x - vp.x) * sc + (wx - camX) * unit, y: vp.y + (near.y - vp.y) * sc - rankY * unit, unit };
}
// side: 'ally' | 'enemy', rank: 0=前列
const slotX = (side, rank) => shift + (side === 'ally' ? -rank * RANK_GAP : GAP + rank * RANK_GAP);

// ===== 演出用の状態 =====
const enter = { ally: new Array(FILES).fill(0), enemy: new Array(FILES).fill(0) };
const dying = [];    // 倒れる途中の兵 { side, file, wx, t }
const corpses = [];  // 地面の兵 { side, file, wx, t }
const fx = [];       // 火花・血
const texts = [];    // 浮かぶ文字
let shake = 0;

function burst(file, wx, y, color, n, speed = 160) {
  for (let k = 0; k < n; k++) fx.push({ file, wx, y, vx: rand(-speed, speed), vy: rand(-speed * 1.2, speed * 0.3), life: rand(0.25, 0.55), color });
}
function say(file, wx, text, color, size = 15, y = 300) { texts.push({ file, wx, y, text, color, size, life: 1 }); }

// ===== 音 =====
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); loadSamples(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
// 効果音（Kenney の CC0 素材）。読み込めなかった音は、プログラムで作った音で代用する
const SAMPLE_SETS = { bronze: 5, wicker: 5, hit: 5, fall: 5, step: 5, clatter: 3 };
const SAMPLE_FILES = { bronze: 'shield_bronze', wicker: 'shield_wicker', hit: 'hit', fall: 'fall', step: 'step', clatter: 'clatter' };
const samples = {};
// 勝敗の曲（assets/music/victory.mp3・defeat.mp3）。ファイルがなければ鳴らさない
const music = {};
let musicNode = null;
function loadMusic() {
  for (const name of ['victory', 'defeat']) {
    fetch(`assets/music/${name}.mp3`).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(buf => new Promise((ok, ng) => ac.decodeAudioData(buf, ok, ng)))
      .then(b => { music[name] = b; }).catch(() => {});
  }
}
function playMusic(name) {
  stopMusic();
  const a = ac, b = music[name];
  if (!a || !b) return;
  const src = a.createBufferSource(), g = a.createGain(), t = a.currentTime;
  src.buffer = b;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.6); // 絵に合わせて少しフェードイン
  src.connect(g).connect(a.destination); src.start(t);
  musicNode = { src, g };
}
function stopMusic() {
  if (!musicNode || !ac) return;
  const { src, g } = musicNode, t = ac.currentTime;
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.4);
  src.stop(t + 0.45); musicNode = null;
}
function loadSamples() {
  loadMusic();
  for (const [key, n] of Object.entries(SAMPLE_SETS)) {
    samples[key] = [];
    for (let i = 0; i < n; i++) {
      fetch(`assets/sounds/${SAMPLE_FILES[key]}_${i}.ogg`).then(r => r.arrayBuffer())
        .then(buf => new Promise((ok, ng) => ac.decodeAudioData(buf, ok, ng)))
        .then(b => samples[key].push(b)).catch(() => {});
    }
  }
}
// 同じ音でも毎回少し高さと大きさを変えて、機械っぽさを消す
function play(key, vol = 1, delay = 0, rate = 1) {
  const a = ac, list = samples[key];
  if (!a || !list || !list.length) return false;
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = list[Math.floor(Math.random() * list.length)];
  src.playbackRate.value = rate * (0.9 + Math.random() * 0.2);
  g.gain.value = vol * (0.8 + Math.random() * 0.3);
  src.connect(g).connect(a.destination);
  src.start(a.currentTime + delay);
  return true;
}
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.2, hp = 2000) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
  s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start();
}
let sfxBudget = 0;
const SFX = {
  // 号令：太鼓と、隊全体が一歩踏み込む足音
  drum() {
    tone(65, 0.45, 'sine', 0.7, 0.5); noise(0.12, 0.2, 300);
    for (let k = 0; k < 4; k++) play('step', 0.9, 0.02 + k * 0.035 + Math.random() * 0.02, 0.8);
  },
  // 敵の攻撃を青銅の盾で受けた
  bronze() { if (sfxBudget-- > 0 && !play('bronze', 0.55)) { noise(0.09, 0.12, 3000); tone(1400 + Math.random() * 600, 0.08, 'square', 0.03); } },
  // 突きが編み細工の盾に弾かれた
  wicker() { if (sfxBudget-- > 0 && !play('wicker', 0.7)) noise(0.08, 0.12, 1500); },
  // 敵を突き倒した
  kill() { if (sfxBudget-- > 0 && !play('hit', 0.8)) tone(180, 0.15, 'sawtooth', 0.08, 0.4); },
  // 味方が倒れた：倒れる音と、盾が地面に当たる音
  hurt() { if (sfxBudget-- > 0) { if (!play('fall', 0.9)) tone(110, 0.25, 'triangle', 0.18, 0.5); play('clatter', 0.35, 0.18, 0.8); } },
};

// ===== ルールとつなぐ =====
const contactX = () => shift + GAP / 2;
const game = createGame((type, i, why) => {
  if (type === 'thrust') {
    SFX.drum();
  } else if (type === 'blocked' || type === 'clash') {
    burst(i, contactX(), 260, '#fff2b0', type === 'clash' ? 5 : 8);
    if (type === 'clash') SFX.bronze(); else SFX.wicker();
  } else if (type === 'ourDeath') {
    dying.push({ side: 'ally', file: i, wx: slotX('ally', 0), t: 0 });
    burst(i, slotX('ally', 0) + 40, 230, '#8a1010', 12, 120);
    SFX.hurt(); if (i < 4) shake = Math.max(shake, 6);
  } else if (type === 'enemyDeath') {
    dying.push({ side: 'enemy', file: i, wx: slotX('enemy', 0), t: 0 });
    burst(i, slotX('enemy', 0) - 40, 230, '#8a1010', 10, 120);
    SFX.kill();
  } else if (type === 'ourRefill') {
    enter.ally[i] = 1;
  } else if (type === 'enemyRefill') {
    enter.enemy[i] = 1;
  } else if (type === 'start') {
    stopMusic();
    dying.length = corpses.length = fx.length = texts.length = 0;
    shift = 0; showOverlay();
  } else if (type === 'end') {
    playMusic(i === 'win' ? 'victory' : 'defeat');
    showOverlay();
  }
});

window.phalanx = game; // 開発中の確認用（コンソールから状態を見たり変えたりできる）

// 入力（あとでスマホのセンサーに差し替えられるよう、ここだけに集める）
function doThrust() { audio(); game.thrust(); }
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) doThrust(); }
  if (e.code === 'KeyR') { stopMusic(); game.reset(); dying.length = corpses.length = 0; showOverlay(); }
});
// タイトルや結果の画面の上からでも押せるよう、画面全体で受け取る
addEventListener('pointerdown', e => { e.preventDefault(); doThrust(); }, { passive: false });

// ===== コマの選び方 =====
function allyFrame(S) {
  const t = S.thrustT;
  if (t < 0) return { a: 'guard', dx: 0, breathe: true };
  if (t < 0.07) return { a: 'windup', dx: -10 * ease(t / 0.07) };
  if (t < 0.45) return { a: 'thrust', dx: 26 * ease(clamp01((t - 0.07) / 0.07)), blur: t < 0.16 ? 'windup' : null };
  const b = clamp01((t - 0.45) / (CFG.thrustEnd - 0.45));
  return { a: 'guard', dx: 26 * (1 - ease(b)), ghost: 'thrust', ghostA: 1 - b };
}
function enemyFrame(e) {
  if (e.state === 'windup') return { a: 'windup', dx: 8, cue: 'red' };
  if (e.state === 'strike') return { a: 'strike', dx: -22, blur: 'windup', cue: 'red' };
  if (e.state === 'recover') return { a: 'recover', dx: -10, cue: 'gold' };
  return { a: 'guard', dx: 0, breathe: true };
}

// ===== 描画 =====
function drawFrame(sprite, name, x, y, unit, alpha = 1) {
  const { img, meta } = SPRITES[sprite];
  const f = meta.frames[name];
  const k = unit * BODY_PX / meta.height;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, f.x, f.y, f.w, f.h, x - f.anchor * k, y - f.baseline * k, f.w * k, f.h * k);
  ctx.globalAlpha = 1;
}
function shadow(x, y, unit, w, a = 0.35) {
  ctx.fillStyle = `rgba(30,18,8,${a})`;
  ctx.beginPath(); ctx.ellipse(x, y - 2 * unit, w * unit, 18 * unit, -0.05, 0, Math.PI * 2); ctx.fill();
}
function cue(x, y, unit, color) {
  const c = color === 'red' ? '255,70,50' : '255,215,110';
  const g = ctx.createRadialGradient(x, y, 0, x, y, 95 * unit);
  g.addColorStop(0, `rgba(${c},0.8)`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, 95 * unit, 26 * unit, 0, 0, Math.PI * 2); ctx.fill();
}
function drawUnit(side, file, rank, fr, now) {
  const ally = side === 'ally';
  const sprite = ally ? 'hoplite' : 'persian';
  const p = project(file, slotX(side, rank), rank * 16);
  const en = rank === 0 ? enter[side][file] : 0;
  const x = p.x + (fr.dx + (ally ? -1 : 1) * RANK_GAP * ease(en)) * p.unit;
  const breathe = fr.breathe ? Math.sin(now * 2.2 + file * 1.7 + rank) * 1.5 * p.unit : 0;
  shadow(x + (ally ? 50 : -50) * p.unit, p.y, p.unit, 100);
  if (fr.cue) cue(x - 50 * p.unit, p.y, p.unit, fr.cue);
  if (fr.blur) drawFrame(sprite, fr.blur, x + (ally ? -12 : 12) * p.unit, p.y, p.unit, 0.35);
  if (fr.ghost) drawFrame(sprite, fr.ghost, x, p.y, p.unit, 0.4 * clamp01(fr.ghostA));
  drawFrame(sprite, fr.a, x, p.y + breathe, p.unit);
}

// 背景
const hills = Array.from({ length: 9 }, (_, i) => ({ x: i / 8, h: rand(0.05, 0.12), w: rand(0.15, 0.3) }));
const motes = Array.from({ length: 36 }, () => ({ x: Math.random(), y: rand(0.3, 1), r: rand(30, 110), v: rand(0.004, 0.02), a: rand(0.05, 0.12) }));
// 重い塗り（全画面のグラデーション）は、画面サイズが変わったときだけ別のキャンバスに描いておく
function layer(draw) {
  const c = document.createElement('canvas'), dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = Math.max(1, W * dpr); c.height = Math.max(1, H * dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); draw(g);
  return c;
}
let layers = { key: '' };
function getLayers() {
  const key = W + 'x' + H;
  if (layers.key === key) return layers;
  const { vp } = view(), top = Math.ceil(vp.y);
  layers = {
    key,
    sky: layer(g => {
      const sky = g.createLinearGradient(0, 0, 0, H * 0.45);
      sky.addColorStop(0, '#6f8fb6'); sky.addColorStop(1, '#e2cfa6');
      g.fillStyle = sky; g.fillRect(0, 0, W, top + 2);
      const sun = g.createRadialGradient(W * 0.85, H * 0.28, 0, W * 0.85, H * 0.28, W * 0.5);
      sun.addColorStop(0, 'rgba(255,225,160,0.9)'); sun.addColorStop(1, 'rgba(255,225,160,0)');
      g.fillStyle = sun; g.fillRect(0, 0, W, top + 2);
      g.fillStyle = '#9b8f6b';
      for (const h of hills) { g.beginPath(); g.ellipse(h.x * W, H * 0.44, h.w * W, h.h * H, 0, Math.PI, 0); g.fill(); }
    }),
    // 地面の上に重ねる光：奥は砂ぼこりでかすみ、手前は影で少し暗い
    groundLight: layer(g => {
      const hz = g.createLinearGradient(0, top, 0, H);
      hz.addColorStop(0, 'rgba(222,200,160,1)'); hz.addColorStop(0.4, 'rgba(222,200,160,0)');
      hz.addColorStop(0.6, 'rgba(60,35,15,0)'); hz.addColorStop(1, 'rgba(60,35,15,0.35)');
      g.fillStyle = hz; g.fillRect(0, top, W, H - top);
    }),
  };
  return layers;
}
const moteImg = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(230,205,160,1)'); r.addColorStop(1, 'rgba(230,205,160,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return c;
})();
// 地面：真上から見たテクスチャを、1〜2px の横帯ごとに奥行きに合わせて縮めて貼る
const groundTex = new Image();
let groundPat = null;
groundTex.onload = () => { groundPat = ctx.createPattern(groundTex, 'repeat'); };
groundTex.src = 'assets/textures/rocky_terrain_02_dry.jpg';
const TILE = 760;      // テクスチャ1枚ぶんの大きさ（ワールドpx）
const DEPTH_PX = 260;  // 奥行きの縮み具合
function ground() {
  const { near, vp, base } = view();
  const top = Math.ceil(vp.y);
  if (groundPat) {
    const S = groundTex.width, step = 2;
    ctx.fillStyle = groundPat;
    for (let y = top; y < H; y += step) {
      const sc = (y + step / 2 - vp.y) / (near.y - vp.y);
      if (sc <= 0.004) continue;
      const k = base * sc;                                // 画面px / ワールドpx（この帯での）
      const cx = vp.x + (near.x - vp.x) * sc - camX * k;  // ワールドx=0 の画面位置
      const a = TILE * k / S;
      const v = ((DEPTH_PX / sc) / TILE * S) % S;
      groundPat.setTransform(new DOMMatrix([a, 0, 0, 1, cx, y - v]));
      ctx.fillRect(0, y, W, step);
    }
  } else {
    ctx.fillStyle = '#a98756'; ctx.fillRect(0, top, W, H - top);
  }
  ctx.drawImage(getLayers().groundLight, 0, 0, W, H);
}

function background() {
  ctx.drawImage(getLayers().sky, 0, 0, W, H);
  ground();
  // 勝ち・負けの線（地面の目印）
  for (const [line, color] of [[CFG.lineWin, '170,40,30'], [CFG.lineLose, '40,70,130']]) {
    const wx = -(line - CFG.lineStart) * LINE_PX + (line === CFG.lineWin ? GAP + RANK_GAP : -RANK_GAP * 1.5);
    const a = project(0, wx), b = project(FILES + 6, wx);
    ctx.strokeStyle = `rgba(${color},0.55)`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
}

function draw(dt, now) {
  const S = game.S;
  background();
  for (let f = FILES - 1; f >= 0; f--) {
    for (const c of corpses) if (c.file === f) {
      const p = project(f, c.wx), a = clamp01((7 - c.t) / 1.5);
      const sprite = c.side === 'ally' ? 'hoplite' : 'persian';
      shadow(p.x, p.y, p.unit, 160, 0.3 * a);
      drawFrame(sprite, 'fallen', p.x, p.y + 6 * p.unit, p.unit, a);
    }
    for (let r = SHOW_RANKS - 1; r >= 1; r--) {
      if (r <= S.depth[f]) drawUnit('enemy', f, r, { a: 'guard', dx: 0, breathe: true }, now);
      if ((r - 1) * FILES + f < S.reserves) drawUnit('ally', f, r, { a: 'guard', dx: 0, breathe: true }, now);
    }
    for (const d of dying) if (d.file === f) {
      const p = project(f, d.wx);
      const ally = d.side === 'ally', sprite = ally ? 'hoplite' : 'persian';
      const dx = (ally ? -18 : 18) * ease(clamp01(d.t / 0.16)) * p.unit;
      shadow(p.x + dx, p.y, p.unit, 100);
      drawFrame(sprite, d.t < 0.16 ? 'hit' : 'collapse', p.x + dx, p.y, p.unit);
    }
    if (S.enemies[f].alive) drawUnit('enemy', f, 0, enemyFrame(S.enemies[f]), now);
    if (S.ours[f].alive) drawUnit('ally', f, 0, allyFrame(S), now);
  }
  for (const q of fx) {
    const p = project(q.file, q.wx);
    ctx.globalAlpha = clamp01(q.life * 3); ctx.fillStyle = q.color;
    ctx.fillRect(p.x + q.ox * p.unit - 2, p.y - (q.y - q.oy) * p.unit - 2, 4, 4);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'center';
  for (const t of texts) {
    const p = project(t.file, t.wx);
    ctx.globalAlpha = clamp01(t.life * 2); ctx.fillStyle = t.color;
    ctx.font = `bold ${Math.max(12, t.size * Math.min(1.3, p.unit * 1.3))}px sans-serif`;
    ctx.strokeStyle = '#000a'; ctx.lineWidth = 3;
    const y = p.y - t.y * p.unit;
    ctx.strokeText(t.text, p.x, y); ctx.fillText(t.text, p.x, y);
  }
  ctx.globalAlpha = 1;
  for (const m of motes) {
    m.x += m.v * dt; if (m.x > 1.1) m.x = -0.1;
    ctx.globalAlpha = m.a;
    ctx.drawImage(moteImg, m.x * W - m.r, m.y * H - m.r, m.r * 2, m.r * 2);
  }
  ctx.globalAlpha = 1;
}

function updateFx(dt) {
  const S = game.S;
  shift += (-(S.line - CFG.lineStart) * LINE_PX - shift) * Math.min(1, dt * 5);
  camX = shift * CAM_FOLLOW;
  for (const side of ['ally', 'enemy']) for (let i = 0; i < FILES; i++) enter[side][i] = Math.max(0, enter[side][i] - dt * 2.5);
  for (let i = dying.length - 1; i >= 0; i--) {
    const d = dying[i]; d.t += dt;
    if (d.t > 0.5) { corpses.push({ side: d.side, file: d.file, wx: d.wx + (d.side === 'ally' ? -18 : 18), t: 0 }); dying.splice(i, 1); }
  }
  for (let i = corpses.length - 1; i >= 0; i--) if ((corpses[i].t += dt) > 7) corpses.splice(i, 1);
  for (let i = fx.length - 1; i >= 0; i--) {
    const q = fx[i];
    if (q.ox === undefined) { q.ox = 0; q.oy = 0; }
    q.ox += q.vx * dt; q.oy += q.vy * dt; q.vy += 500 * dt;
    if ((q.life -= dt) <= 0) fx.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) { texts[i].y += 40 * dt; if ((texts[i].life -= dt) <= 0) texts.splice(i, 1); }
  shake = Math.max(0, shake - dt * 30);
}

// ===== タイトルのスライドショー =====
// 両軍の整列の絵。7秒ごとに、横に流しながらフェードで切り替える
const TITLE_IMAGES = ['assets/screens/title_1.jpg', 'assets/screens/title_2.jpg', 'assets/screens/title_3.jpg'];
let slideTimer = null, slideIndex = -1;
function nextSlide() {
  const slides = document.querySelectorAll('#slides div');
  if (!slides.length) return;
  const prev = slides[slideIndex];
  slideIndex = (slideIndex + 1) % slides.length;
  const cur = slides[slideIndex];
  cur.classList.remove('pan-l', 'pan-r');
  void cur.offsetWidth; // アニメーションを最初からやり直す
  cur.classList.add('show', slideIndex % 2 ? 'pan-r' : 'pan-l');
  if (prev && prev !== cur) prev.classList.remove('show');
}
function startSlides() { stopSlides(); slideIndex = -1; nextSlide(); slideTimer = setInterval(nextSlide, 7000); }
function stopSlides() { clearInterval(slideTimer); slideTimer = null; }

// ===== ギリシャ数字（イオニア式：Αʹ=1, Ιʹ=10, Ρʹ=100） =====
const G_ONES = ['', 'Α', 'Β', 'Γ', 'Δ', 'Ε', 'Ϛ', 'Ζ', 'Η', 'Θ'];
const G_TENS = ['', 'Ι', 'Κ', 'Λ', 'Μ', 'Ν', 'Ξ', 'Ο', 'Π', 'Ϟ'];
const G_HUNDREDS = ['', 'Ρ', 'Σ', 'Τ', 'Υ', 'Φ', 'Χ', 'Ψ', 'Ω', 'Ϡ'];
function greek(n) {
  n = Math.max(0, Math.floor(n));
  if (n === 0) return '—'; // ギリシャ数字には0がない
  const th = Math.floor(n / 1000) % 10;
  return (th ? '͵' + G_ONES[th] : '') + G_HUNDREDS[Math.floor(n / 100) % 10] + G_TENS[Math.floor(n / 10) % 10] + G_ONES[n % 10] + 'ʹ';
}

// ===== HUD・オーバーレイ =====
const $ = id => document.getElementById(id);
function showOverlay() {
  const S = game.S, ov = $('overlay');
  ov.classList.remove('end', 'win', 'lose', 'title');
  stopSlides();
  if (S.phase === 'play') { ov.classList.add('hidden'); return; }
  ov.classList.remove('hidden');
  if (S.phase === 'title') {
    ov.classList.add('title');
    ov.innerHTML = `<div id="slides">${TITLE_IMAGES.map(src => `<div style="background-image:url(${src})"></div>`).join('')}</div>
      <h1>PHALANX</h1>
      <p class="start">ΑΡΧΗ</p>
      <p class="key">SPACE · TAP</p>`;
    startSlides();
  } else {
    const win = S.phase === 'win';
    ov.classList.add('end', win ? 'win' : 'lose');
    ov.innerHTML = `<div class="bg"></div><h1>${win ? 'ΝΙΚΗ' : 'ΗΤΤΑ'}</h1>
      <p class="stats"><i class="ico spara"></i><b>${greek(S.kills)}</b>　<i class="ico aspis"></i><b>${greek(S.lost)}</b></p>
      <p class="again">↻</p>`;
  }
}
function updateHud() {
  const S = game.S;
  $('ally').textContent = greek(S.ours.filter(o => o.alive).length + S.reserves);
  $('foe').textContent = greek(game.enemyTotal());
  const p = (S.line - CFG.lineWin) / (CFG.lineLose - CFG.lineWin);
  $('gaugeFill').style.width = (100 * (1 - p)).toFixed(1) + '%';
  $('gaugeFill').style.background = p < 0.5 ? '#e0b25a' : p < 0.8 ? '#e07b39' : '#e04848';
  // 列ごとの敵の合図（赤＝構え・攻撃、金＝戻り、空＝敵がいない）。左が手前
  const pips = $('pips');
  if (!pips.childElementCount) {
    pips.innerHTML = Array.from({ length: FILES }, () => '<i></i>').join('');
  }
  const dots = pips.querySelectorAll('i');
  S.enemies.forEach((e, i) => {
    dots[i].className = !e.alive ? 'gap' : e.state === 'windup' || e.state === 'strike' ? 'red' : e.state === 'recover' ? 'gold' : '';
  });
  pips.classList.toggle('hidden', S.phase !== 'play');
  $('hud').classList.toggle('hidden', S.phase !== 'play');
}

// ===== ループ =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  sfxBudget = 3;
  game.update(dt);
  updateFx(dt);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  draw(dt, now / 1000);
  ctx.restore();
  updateHud();
  requestAnimationFrame(loop);
}
// 勝敗の絵は先に読み込んでおく（終わった瞬間に出せるように）
for (const n of ['victory', 'defeat']) new Image().src = `assets/screens/${n}.jpg`;
Promise.all(Object.keys(SPRITES).map(loadSprite))
  .then(() => { showOverlay(); requestAnimationFrame(loop); })
  .catch(err => {
    ctx.fillStyle = '#f2e8d2'; ctx.font = '16px sans-serif';
    ctx.fillText('素材を読み込めませんでした。ローカルサーバー経由で開いてください。 ' + err, 20, 40);
  });
</script>
