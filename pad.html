<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a140e">
<title>Phalanx · Pad</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#1a140e; color:#f2e8d2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #status { position:fixed; top:12px; left:0; right:0; text-align:center; font-size:13px; color:#f2e8d2aa;
    font-family: ui-monospace, Menlo, monospace; }
  #detail { margin-top:4px; font-size:10px; opacity:.6; }
  body.linked #detail { display:none; }
  #status .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#777; margin-right:6px; vertical-align:1px; }
  body.linked #status .dot { background:#6fd06f; }
  body.error #status .dot, body.closed #status .dot { background:#e04848; }
  #btn { width:min(78vw, 78vh); height:min(78vw, 78vh); border-radius:50%; border:3px solid #e0b25a;
    background:radial-gradient(circle at 50% 40%, #5a3d1e, #2a1c0e 70%); color:#e0b25a;
    font-family: Georgia, "Times New Roman", serif; font-size:min(16vw, 16vh); letter-spacing:.06em;
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 0 #e0b25a00;
    transition: transform .06s, box-shadow .2s, opacity .2s; }
  body:not(.linked) #btn { opacity:.35; }
  #btn { flex-direction:column; }
  #btn small { font-size:.32em; letter-spacing:.2em; opacity:.8; margin-bottom:.15em; }
  #btn svg { width:68%; height:68%; }
  body.win #btn small { color:#f0cf8a; } body.lose #btn small { color:#e07b6a; }
  /* 動きのセンサー：◎ が出ていれば使える。平らにすると金色に光り、突き出せる */
  #sensor { display:none; margin-left:10px; color:#e0b25a; opacity:.45; }
  html.motion-on #sensor, html.motion-ask #sensor { display:inline; }
  html.motion-ask #sensor { animation: ask 1.4s ease-in-out infinite; }
  @keyframes ask { 50% { opacity:.1; } }
  html.flat #sensor { opacity:1; }
  html.flat body.linked #btn { box-shadow:0 0 28px 2px #e0b25a55; border-color:#ffd88a; }
  #debug { position:fixed; bottom:10px; left:0; right:0; text-align:center; font:11px ui-monospace, Menlo, monospace; opacity:.6; }
  #btn.hit { transform:scale(.94); box-shadow:0 0 40px 6px #e0b25a66; transition:none; }
</style>
</head>
<body>
<div id="status"><span class="dot"></span><span id="txt">…</span><span id="sensor">◎</span><div id="detail"></div></div>
<div id="debug"></div>
<div id="btn"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script type="module">
import { padLink } from './src/link.js?v=5'; // ?v= を上げると、ブラウザに残った古いファイルを使わない
import { motionThrust } from './src/motion.js?v=1';

const hostId = location.hash.slice(1).replace(/[^a-z0-9]/g, '');
const txt = document.getElementById('txt'), btn = document.getElementById('btn');

// ボタンの中身は場面で変える
const SPEAR = '<svg viewBox="0 0 100 100"><path d="M10 50H74" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M70 50Q78 41 95 50Q78 59 70 50Z" fill="currentColor"/><path d="M5 50L9 46H20V54H9Z" fill="currentColor"/></svg>';
const FACE = {
  gate: '⟡',
  title: 'ΑΡΧΗ',
  play: SPEAR,
  win: '<small>ΝΙΚΗ</small>↻',
  lose: '<small>ΗΤΤΑ</small>↻',
};
let phase = 'gate', conn = 'connecting';
function render() {
  document.body.className = conn + (conn === 'linked' ? ' ' + phase : '');
  btn.innerHTML = conn === 'linked' ? (FACE[phase] || '⟡') : '⟡';
}
function setStatus(s) {
  conn = s; render();
  txt.textContent = s === 'linked' ? (link.rtt == null ? 'linked' : Math.round(link.rtt) + ' ms' + (link.route ? ' · ' + link.route : '')) : s === 'connecting' ? '…' : '✕';
}

let link = { rtt: null, thrust: () => false };
if (!hostId) setStatus('error');
else link = padLink(hostId, {
  onStatus: setStatus,
  onMessage: msg => {
    if (msg.t === 'pong' && conn === 'linked') setStatus('linked');
    else if (msg.t === 'state' && FACE[msg.phase]) { phase = msg.phase; render(); }
  },
});

// 合図を送る。ボタンでも、平らにして突き出しても同じ
function fire() {
  if (!link.thrust()) return;
  btn.classList.add('hit');
  if (navigator.vibrate) navigator.vibrate(15);
  setTimeout(() => btn.classList.remove('hit'), 90);
}
// 押した瞬間に送る（離したときではない）
btn.addEventListener('pointerdown', e => {
  e.preventDefault();
  motion.start(); // iPhone では、ここで初めてセンサーの許可を頼める
  fire();
});

// 動きのセンサー。URL に ?jab=10 などを付けると、突き出しの強さのしきい値を変えられる
const q = new URLSearchParams(location.search);
const opts = {};
if (q.has('jab')) opts.jab = Number(q.get('jab'));
const motion = motionThrust({
  ...opts,
  onThrust: fire,
  onState: (st, flat) => {
    const c = document.documentElement.classList;
    c.toggle('motion-on', st === 'on');
    c.toggle('motion-ask', st === 'needs-permission');
    c.toggle('flat', st === 'on' && flat);
  },
});
// 調整用：URL に ?debug を付けると、平らかどうかと、最近いちばん強かった動きを出す
if (q.has('debug')) setInterval(() => {
  document.getElementById('debug').textContent =
    `${motion.state} · ${motion.flat ? 'flat' : 'tilt'} · peak ${motion.peak.toFixed(1)} / ${motion.cfg.jab}`;
}, 100);
addEventListener('contextmenu', e => e.preventDefault());

// つながらないときは、どこで止まっているかを小さく出す（原因を調べるため）
const detailEl = document.getElementById('detail');
setInterval(() => { if (link.detail) detailEl.textContent = link.detail(); }, 500);

// 画面が消えると接続が切れるので、つながっている間は画面をつけたままにする（対応している端末だけ）。
// 画面に戻ってくると解除されているので、そのたびに頼み直す
let wake = null;
async function keepAwake() {
  if (!('wakeLock' in navigator) || wake || document.visibilityState !== 'visible') return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
  catch { /* 電池残量が少ないときなどは断られる。そのままで問題ない */ }
}
keepAwake();
document.addEventListener('visibilitychange', keepAwake);
addEventListener('pointerdown', keepAwake);
</script>
</body>
</html>
