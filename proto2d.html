<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phalanx</title>
<style>
  :root { --bg:#14110d; --fg:#eadfc8; --dim:#9a8b70; --accent:#d9a441; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { background:#2a2419; max-width:100vw; max-height:100vh; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<script>
'use strict';
// ===== 設定 =====
const CFG = {
  cols: 11,
  colW: 76,
  rankGap: 26,
  reserves: 40,          // 自軍の予備兵
  enemyStartDepth: 3,    // 敵の各列の初期の後列数
  enemyMaxDepth: 9,
  lineStart: 340, lineWin: 120, lineLose: 575,
  thrustHitAt: 0.14, thrustEnd: 0.8, // 突きの当たり判定時刻と、無防備が終わる時刻
  counterChance: 0.25,   // 守っている敵に突いたとき反撃される確率
  gapExposeChance: 0.5,  // 右隣が空いているとき、守っていても倒される確率
  ourRefill: 0.7, enemyRefill: 0.5,
  pushPerEnemy: 0.32, pushBase: 12, pushPerKill: 3.5, pushPerBlock: 1.2,
  enemy: { guardMin: 1.1, guardMax: 3.6, windup: 0.6, strike: 0.2, recover: 0.75 },
  spawnStart: 1.3, spawnMin: 0.55, spawnRamp: 0.012,
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const X0 = (W - CFG.cols * CFG.colW) / 2 + CFG.colW / 2;
const colX = i => X0 + i * CFG.colW;

// ===== 入力（あとでスマホのセンサーに差し替えられるように分離） =====
const Input = {
  handlers: [],
  onThrust(fn) { this.handlers.push(fn); },
  fire() { this.handlers.forEach(f => f()); },
};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) Input.fire(); }
  if (e.code === 'KeyR') reset();
});
cv.addEventListener('pointerdown', () => Input.fire());

// ===== 音 =====
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function tone(freq, dur, type = 'sine', vol = 0.3, slide = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.2, hp = 2000) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
  s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start();
}
let sfxBudget = 0; // 同時に鳴りすぎないように
const SFX = {
  drum() { tone(70, 0.35, 'sine', 0.6, 0.5); noise(0.08, 0.15, 400); },
  clang() { if (sfxBudget-- > 0) { noise(0.09, 0.12, 3000); tone(1400 + Math.random() * 600, 0.08, 'square', 0.03); } },
  kill() { if (sfxBudget-- > 0) tone(180, 0.15, 'sawtooth', 0.08, 0.4); },
  hurt() { if (sfxBudget-- > 0) tone(110, 0.25, 'triangle', 0.18, 0.5); },
};

// ===== 状態 =====
let S;
function reset() {
  S = {
    phase: 'title', t: 0,
    line: CFG.lineStart, lineVis: CFG.lineStart,
    reserves: CFG.reserves,
    thrustT: -1, // <0: 守り
    ours: [], enemies: [], depth: [],
    spawnTimer: CFG.spawnStart, spawnInt: CFG.spawnStart,
    fx: [], texts: [], corpses: [], pending: [],
    kills: 0, lost: 0, thrusts: 0, shake: 0,
  };
  for (let i = 0; i < CFG.cols; i++) {
    S.ours.push({ alive: true, refill: 0, hitFlash: 0 });
    S.enemies.push(newEnemy());
    S.depth.push(CFG.enemyStartDepth);
  }
}
function newEnemy() {
  return { alive: true, refill: 0, state: 'guard', st: rand(CFG.enemy.guardMin, CFG.enemy.guardMax), hitFlash: 0, resolved: false };
}
const rand = (a, b) => a + Math.random() * (b - a);
const ourY = () => S.lineVis + 22;
const enY = () => S.lineVis - 22;
const exposed = () => S.thrustT >= 0 && S.thrustT < CFG.thrustEnd;

Input.onThrust(() => {
  audio();
  if (S.phase === 'title') { S.phase = 'play'; return; }
  if (S.phase !== 'play') { reset(); S.phase = 'play'; return; }
  if (S.thrustT >= 0) return; // 突きの途中
  S.thrustT = 0; S.resolvedThrust = false; S.thrusts++;
  SFX.drum();
  addText(W / 2, ourY() + 70, '突け！', '#d9a441', 22);
});

// ===== 判定 =====
function killOurs(i, why) {
  const o = S.ours[i]; if (!o.alive) return;
  o.alive = false; o.refill = CFG.ourRefill; S.lost++;
  S.corpses.push({ x: colX(i) + rand(-8, 8), y: ourY() + rand(0, 10), side: 0, life: 6 });
  burst(colX(i), ourY(), '#c0392b', 10);
  addText(colX(i), ourY() + 30, why, '#ff7b6b', 13);
  SFX.hurt(); S.shake = Math.max(S.shake, 5);
}
function killEnemy(i) {
  const e = S.enemies[i]; if (!e.alive) return;
  e.alive = false; e.refill = CFG.enemyRefill; S.kills++;
  S.corpses.push({ x: colX(i) + rand(-8, 8), y: enY() - rand(0, 10), side: 1, life: 6 });
  burst(colX(i), enY(), '#e8d4a0', 8);
  S.line -= CFG.pushPerKill;
  SFX.kill();
}
function resolveThrust() {
  for (let i = 0; i < CFG.cols; i++) {
    const o = S.ours[i], e = S.enemies[i];
    if (!o.alive || !e.alive) continue;
    if (e.state === 'guard') {
      clash(colX(i), S.lineVis);
      if (Math.random() < CFG.counterChance) S.pending.push({ at: S.t + 0.12, fn: () => { if (exposed()) killOurs(i, '反撃'); } });
    } else if (e.state === 'strike') {
      killEnemy(i);
      if (Math.random() < 0.5) killOurs(i, '相打ち');
    } else {
      killEnemy(i); // 構え中・戻り中はスキ
    }
  }
  // 突かれた敵は警戒して盾を固める（連打は通じない）
  for (const e of S.enemies) {
    if (e.alive && e.state !== 'strike' && e.state !== 'windup') { e.state = 'guard'; e.st = Math.max(e.st, rand(0.8, 2.2)); }
  }
}
function enemyStrike(i) {
  const o = S.ours[i];
  if (!o.alive) { S.line += CFG.pushPerBlock * 2; return; } // 穴に入り込まれる
  if (exposed()) { killOurs(i, '突かれた'); return; }
  const rightGap = i < CFG.cols - 1 && !S.ours[i + 1].alive;
  if (rightGap && Math.random() < CFG.gapExposeChance) { killOurs(i, '右が空いた'); return; }
  clash(colX(i), S.lineVis); o.hitFlash = 0.15;
  S.line += CFG.pushPerBlock;
}

// ===== 演出 =====
function burst(x, y, color, n) {
  for (let k = 0; k < n; k++) S.fx.push({ x, y, vx: rand(-90, 90), vy: rand(-90, 90), life: rand(0.3, 0.6), color });
}
function clash(x, y) { burst(x, y, '#fff2b0', 4); SFX.clang(); }
function addText(x, y, s, color, size) { S.texts.push({ x, y, s, color, size, life: 0.9 }); }

// ===== 更新 =====
function update(dt) {
  S.t += dt; sfxBudget = 3;
  S.shake = Math.max(0, S.shake - dt * 30);
  S.lineVis += (S.line - S.lineVis) * Math.min(1, dt * 6);
  S.fx = S.fx.filter(p => (p.x += p.vx * dt, p.y += p.vy * dt, p.vx *= 0.9, p.vy *= 0.9, (p.life -= dt) > 0));
  S.texts = S.texts.filter(t => (t.y -= 20 * dt, (t.life -= dt) > 0));
  S.corpses = S.corpses.filter(c => (c.life -= dt) > 0);
  if (S.phase !== 'play') return;

  // 予約イベント（反撃など）
  S.pending = S.pending.filter(p => (S.t >= p.at ? (p.fn(), false) : true));

  // 突き
  if (S.thrustT >= 0) {
    S.thrustT += dt;
    if (!S.resolvedThrust && S.thrustT >= CFG.thrustHitAt) { S.resolvedThrust = true; resolveThrust(); }
    if (S.thrustT >= CFG.thrustEnd) S.thrustT = -1;
  }

  // 自軍の補充
  for (const o of S.ours) {
    o.hitFlash = Math.max(0, o.hitFlash - dt);
    if (!o.alive && S.reserves > 0) {
      o.refill -= dt;
      if (o.refill <= 0) { o.alive = true; S.reserves--; }
    }
  }

  // 敵
  const E = CFG.enemy;
  for (let i = 0; i < CFG.cols; i++) {
    const e = S.enemies[i];
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    if (!e.alive) {
      if (S.depth[i] > 0) { e.refill -= dt; if (e.refill <= 0) { Object.assign(e, newEnemy()); S.depth[i]--; } }
      continue;
    }
    e.st -= dt;
    if (e.st > 0) continue;
    if (e.state === 'guard') { e.state = 'windup'; e.st = E.windup * rand(0.85, 1.15); }
    else if (e.state === 'windup') { e.state = 'strike'; e.st = E.strike; enemyStrike(i); }
    else if (e.state === 'strike') { e.state = 'recover'; e.st = E.recover * rand(0.85, 1.15); }
    else { e.state = 'guard'; e.st = rand(E.guardMin, E.guardMax); }
  }

  // 敵の増援（だんだん速く）
  S.spawnTimer -= dt;
  if (S.spawnTimer <= 0) {
    S.spawnInt = Math.max(CFG.spawnMin, S.spawnInt - CFG.spawnRamp * S.spawnInt * 3);
    S.spawnTimer = S.spawnInt;
    const i = Math.floor(Math.random() * CFG.cols);
    if (S.depth[i] < CFG.enemyMaxDepth) S.depth[i]++;
  }

  // 押し合い：敵の数が多いほど後ろへ押される
  const total = enemyTotal();
  S.line += Math.max(-4, (total * CFG.pushPerEnemy - CFG.pushBase)) * dt;

  // 勝敗
  if (S.line <= CFG.lineWin || total === 0) end('win');
  else if (S.line >= CFG.lineLose) end('lose', '押し切られた');
  else if (S.reserves === 0 && S.ours.every(o => !o.alive)) end('lose', '隊が尽きた');
}
function enemyTotal() { return S.enemies.filter(e => e.alive).length + S.depth.reduce((a, b) => a + b, 0); }
function end(r, why) { S.phase = r; S.why = why; S.endT = S.t; }

// ===== 描画 =====
function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  // 地面
  ctx.fillStyle = '#2a2419'; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.fillStyle = '#3a2618'; ctx.fillRect(-10, -10, W + 20, CFG.lineWin + 10); // 敵陣
  ctx.fillStyle = '#1b2430'; ctx.fillRect(-10, CFG.lineLose, W + 20, H);      // 自陣の背後
  ctx.strokeStyle = '#ffffff22'; ctx.setLineDash([6, 8]);
  line(0, CFG.lineWin, W, CFG.lineWin); line(0, CFG.lineLose, W, CFG.lineLose); ctx.setLineDash([]);
  ctx.fillStyle = '#ffffff44'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('敵陣（ここまで押せば勝ち）', 12, CFG.lineWin - 8);
  ctx.fillText('後がない（ここまで押されたら負け）', 12, CFG.lineLose + 16);

  for (const c of S.corpses) {
    ctx.globalAlpha = Math.min(1, c.life / 2) * 0.5;
    ctx.fillStyle = c.side ? '#5a2a2a' : '#6a5030';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 11, 6, 0.4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const ey = enY(), oy = ourY();
  // 敵の後列
  for (let i = 0; i < CFG.cols; i++) for (let k = 0; k < S.depth[i]; k++) {
    const y = ey - CFG.rankGap * (k + 1);
    if (y < -20) break;
    body(colX(i), y, '#6b2f3a', '#3d1a22', 1, 0.75);
  }
  // 自軍の予備（後列）
  const perRow = CFG.cols;
  const rows = Math.ceil(S.reserves / perRow);
  for (let r = 0; r < rows; r++) for (let i = 0; i < perRow; i++) {
    if (r * perRow + i >= S.reserves) break;
    const y = oy + CFG.rankGap * (r + 1);
    if (y > H + 20) break;
    body(colX(i), y, '#a07a3c', '#5d4520', -1, 0.75);
  }

  // 前列：敵
  for (let i = 0; i < CFG.cols; i++) {
    const e = S.enemies[i]; if (!e.alive) continue;
    drawEnemy(colX(i), ey, e);
  }
  // 前列：自軍
  const tt = S.thrustT;
  const ext = tt < 0 ? 0 : tt < CFG.thrustHitAt ? tt / CFG.thrustHitAt : Math.max(0, 1 - (tt - CFG.thrustHitAt) / (CFG.thrustEnd - CFG.thrustHitAt));
  for (let i = 0; i < CFG.cols; i++) {
    const o = S.ours[i];
    if (!o.alive) {
      if (S.reserves > 0) { ctx.globalAlpha = 0.35; body(colX(i), oy + CFG.rankGap * (1 - Math.max(0, o.refill) / CFG.ourRefill) * -0 + 8, '#a07a3c', '#5d4520', -1, 0.9); ctx.globalAlpha = 1; }
      continue;
    }
    drawOurs(colX(i), oy, o, ext);
  }

  for (const p of S.fx) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of S.texts) { ctx.globalAlpha = Math.min(1, t.life * 2); ctx.fillStyle = t.color; ctx.font = `bold ${t.size}px sans-serif`; ctx.fillText(t.s, t.x, t.y); }
  ctx.globalAlpha = 1;
  ctx.restore();

  hud();
  if (S.phase === 'title') overlay('PHALANX', ['盾を並べて守れ。号令で一斉に突け。',
    '', 'スペースキー（またはクリック）＝ 隊全体で突く', 'それ以外はずっと守り',
    '', '赤く光る敵 ＝ 攻撃の構え（スキあり、でも来る）', '盾を下ろした敵 ＝ 戻り中（狙いどき）', '盾を構えた敵に突くと、弾かれて反撃されることがある',
    '突いている間は無防備。守ってばかりだと敵が増えて押される。', '', 'スペースで開始']);
  if (S.phase === 'win') overlay('勝利', [`敵陣まで押し切った（${S.endT.toFixed(1)}秒）`, `倒した敵 ${S.kills}　失った味方 ${S.lost}　突撃 ${S.thrusts}回`, '', 'スペースでもう一度']);
  if (S.phase === 'lose') overlay('敗北', [S.why, `倒した敵 ${S.kills}　失った味方 ${S.lost}　突撃 ${S.thrusts}回`, '', 'スペースでもう一度']);
}
function line(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
// dir: 1=下向き（敵）, -1=上向き（自軍）
function body(x, y, c1, c2, dir, s = 1) {
  ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(x, y, 13 * s, 0, 7); ctx.fill();
  ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(x, y + dir * 4 * s, 10 * s, 0, 7); ctx.fill();
}
function shield(x, y, dir, color, open) {
  // 盾は左手：自軍は画面左寄り（左隣を覆う）、敵は向かい合うので画面右寄り
  const off = dir < 0 ? -12 : 12;
  ctx.fillStyle = color; ctx.strokeStyle = '#00000066'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (open) ctx.ellipse(x + off * 1.6, y + dir * 2, 7, 15, 0, 0, 7);
  else ctx.ellipse(x + off * 0.6, y + dir * 12, 26, 9, 0, 0, 7);
  ctx.fill(); ctx.stroke();
}
function spear(x, y, dir, len) {
  ctx.strokeStyle = '#c9b38a'; ctx.lineWidth = 3;
  const sx = x + (dir < 0 ? 10 : -10);
  line(sx, y - dir * 6, sx, y + dir * len);
  ctx.fillStyle = '#e0e0e0'; ctx.beginPath();
  ctx.moveTo(sx, y + dir * (len + 9)); ctx.lineTo(sx - 4, y + dir * len); ctx.lineTo(sx + 4, y + dir * len); ctx.fill();
}
function drawOurs(x, y, o, ext) {
  spear(x, y, -1, 22 + ext * 34);
  body(x, y, '#c89a4a', '#6b4f22', -1);
  shield(x, y - ext * 0, -1, o.hitFlash > 0 ? '#fff0b0' : '#b8862e', ext > 0.05);
}
function drawEnemy(x, y, e) {
  let len = 18, open = false, glow = 0;
  if (e.state === 'windup') { len = 8; open = true; glow = 1; }
  if (e.state === 'strike') { len = 52; open = true; glow = 1; }
  if (e.state === 'recover') { len = 14; open = true; }
  if (glow) { ctx.fillStyle = '#ff3b3b55'; ctx.beginPath(); ctx.arc(x, y, 22, 0, 7); ctx.fill(); }
  spear(x, y, 1, len);
  body(x, y, '#8c3b4a', '#4a1f28', 1);
  shield(x, y, 1, '#5b6470', open);
}
function hud() {
  ctx.fillStyle = '#000000aa'; ctx.fillRect(0, 0, W, 34);
  ctx.font = '15px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#eadfc8';
  const alive = S.ours.filter(o => o.alive).length;
  ctx.fillText(`味方 前列${alive}  予備${S.reserves}`, 14, 22);
  ctx.textAlign = 'right';
  ctx.fillText(`敵 ${enemyTotal()}`, W - 14, 22);
  // 押し合いゲージ
  const gx = 300, gw = 360, p = (S.lineVis - CFG.lineWin) / (CFG.lineLose - CFG.lineWin);
  ctx.fillStyle = '#ffffff22'; ctx.fillRect(gx, 12, gw, 10);
  ctx.fillStyle = p < 0.5 ? '#d9a441' : p < 0.8 ? '#e07b39' : '#e04848';
  ctx.fillRect(gx, 12, gw * (1 - p), 10);
  ctx.textAlign = 'center'; ctx.fillStyle = '#eadfc8'; ctx.font = '11px sans-serif';
  ctx.fillText(S.thrustT >= 0 ? '― 突撃中（無防備）―' : '盾', W / 2, 32 + 0);
}
function overlay(title, lines) {
  ctx.fillStyle = '#000000cc'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#d9a441'; ctx.font = 'bold 48px serif';
  ctx.fillText(title, W / 2, 150);
  ctx.fillStyle = '#eadfc8'; ctx.font = '17px sans-serif';
  lines.forEach((l, k) => ctx.fillText(l, W / 2, 210 + k * 28));
}

// ===== ループ =====
reset();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
